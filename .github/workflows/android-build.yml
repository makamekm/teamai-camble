name: Camble Android Cloud Build
run-name: Camble Android ${{ inputs.requestId }}

on:
  workflow_dispatch:
    inputs:
      requestId:
        description: TeamAI build operation UUID
        required: true
        type: string
      applicationSha:
        required: true
        type: string
      backendSha:
        required: true
        type: string
      storeTrack:
        required: true
        type: choice
        options: [internal, alpha, beta, production]
      releaseTagPrefix:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: camble-android-cloud-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Validate required secrets
        env:
          BUILD_REPOSITORY_TOKEN: ${{ secrets.BUILD_REPOSITORY_TOKEN }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          for name in BUILD_REPOSITORY_TOKEN ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_STORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            test -n "${!name:-}" || { echo "Missing Actions secret: $name" >&2; exit 1; }
          done

      - name: Checkout application at exact SHA
        uses: actions/checkout@v4
        with:
          repository: ruletvorg/application3
          ref: ${{ inputs.applicationSha }}
          token: ${{ secrets.BUILD_REPOSITORY_TOKEN }}
          path: application
          persist-credentials: false

      - name: Checkout backend at exact SHA
        uses: actions/checkout@v4
        with:
          repository: ruletvorg/backend
          ref: ${{ inputs.backendSha }}
          token: ${{ secrets.BUILD_REPOSITORY_TOKEN }}
          path: backend
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci --prefix application
          npm install --prefix application/builder --no-package-lock --no-audit --no-fund

      - name: Generate preinit from exact backend checkout
        working-directory: application
        env:
          BACKEND_DIR: ${{ github.workspace }}/backend
          BACKEND_BRANCH: ${{ inputs.backendSha }}
        run: npm run preinit

      - name: Prepare Android signing
        working-directory: application
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
          chmod 600 android/app/upload.jks

      - name: Build signed APK and AAB
        working-directory: application/android
        env:
          APP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          APP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          APP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          ./gradlew app:bundleRelease app:assembleRelease \
            -PAPP_VERSION_CODE="$VERSION_CODE" \
            -PAPP_UPLOAD_STORE_FILE=upload.jks \
            -PAPP_UPLOAD_STORE_PASSWORD="$APP_UPLOAD_STORE_PASSWORD" \
            -PAPP_UPLOAD_KEY_ALIAS="$APP_UPLOAD_KEY_ALIAS" \
            -PAPP_UPLOAD_KEY_PASSWORD="$APP_UPLOAD_KEY_PASSWORD"
          mkdir -p ../dist
          cp app/build/outputs/bundle/release/app-release.aab ../dist/camble.aab
          cp app/build/outputs/apk/release/app-release.apk ../dist/camble.apk
          printf '{"requestId":"%s","versionCode":%s,"applicationSha":"%s","backendSha":"%s","track":"%s"}\n' \
            '${{ inputs.requestId }}' "$VERSION_CODE" '${{ inputs.applicationSha }}' '${{ inputs.backendSha }}' '${{ inputs.storeTrack }}' > ../dist/build-info.json

      - name: Upload AAB to Google Play
        working-directory: application
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_TRACK: ${{ inputs.storeTrack }}
          RELEASE_TYPE: completed
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > builder/service.json
          chmod 600 builder/service.json
          mkdir -p builder/apk
          cp dist/camble.aab builder/apk/release.aab
          npm run playstore --prefix builder

      - name: Publish public APK and AAB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='${{ inputs.releaseTagPrefix }}'"${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" \
            application/dist/camble.apk \
            application/dist/camble.aab \
            application/dist/build-info.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Camble Android ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes "TeamAI request ${{ inputs.requestId }} · application ${{ inputs.applicationSha }} · backend ${{ inputs.backendSha }} · Play ${{ inputs.storeTrack }}"
